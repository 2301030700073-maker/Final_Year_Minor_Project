# Native signature rules (ADR-0008, roadmap item 5). Matched against each .so's
# dynamic export symbols and embedded strings by src/static/native.py.
# pattern_type: export_symbol (matches symbol names, incl. Java_* JNI exports)
#               | embedded_string (matches strings extracted from the .so)
# A rule that only matches at the bytecode/string layer has no native analogue -
# keep this file to techniques that actually show up in native exports/strings.

- id: native_jni_root_check
  category: root
  weight: 0.5
  pattern_type: export_symbol
  patterns:
    - "Java_com_example_check_root"
    - "checkRoot"
    - "isRooted"

- id: native_su_binary_embedded
  category: root
  weight: 0.4
  pattern_type: embedded_string
  patterns:
    # NOTE - bare substrings deliberately NOT used here. Empirically, a benign
    # BoringSSL libssl.so has 65 embedded strings containing "su"
    # (EVP_PKEY_decapsulate, SSL_*_subjects_to_stack, ...) - a bare "su" or
    # "magisk" pattern false-positives on any stock native lib and would
    # inflate root confidence on a clean app. Only full, structurally-unlikely
    # paths are matched, so a native hit requires the .so to genuinely embed a
    # root-manager path.
    - "/system/bin/su"
    - "/system/xbin/su"
    - "/data/adb/magisk"
    - "/data/adb/ksu"

- id: native_ssl_pinning_verify
  category: ssl
  weight: 0.5
  pattern_type: export_symbol
  patterns:
    - "Java_com_example_verify_cert"
    - "verify_certificate"
    - "checkCertificatePinning"

- id: native_pinning_embedded
  category: ssl
  weight: 0.3
  pattern_type: embedded_string
  patterns:
    - "certificate pinning"
    - "CertificatePinner"
