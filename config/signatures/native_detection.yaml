# Native signature rules (ADR-0008, roadmap item 5). Matched against each .so's
# dynamic export symbols and embedded strings by src/static/native.py.
# pattern_type: export_symbol (matches symbol names, incl. Java_* JNI exports)
#               | embedded_string (matches strings extracted from the .so)
# A rule that only matches at the bytecode/string layer has no native analogue -
# keep this file to techniques that actually show up in native exports/strings.

- id: native_jni_root_check
  category: root
  weight: 0.5
  pattern_type: export_symbol
  patterns:
    - "checkRoot"
    - "isRooted"
    # NOTE: this no longer carries `Java_com_example_*` placeholders - those were
    # example names no real app exports, so they could never fire (dead weight
    # that overclaimed detection surface). Real JNI exports are package- and
    # obfuscation-specific (e.g. UnCrackable-Level2 exports
    # Java_sg_vantagepoint_uncrackable2_CodeCheck_bar), so a general JNI *name*
    # rule cannot be written without overfitting to one corpus - hence this
    # signature keeps only the technique-level symbols and the generic anti-debug
    # combo is covered by native_ptrace_fork_antidebug below.

- id: native_ptrace_fork_antidebug
  category: root
  weight: 0.5
  pattern_type: export_symbol
  require_all: true
  patterns:
    - "ptrace"
    - "fork"
  # The fork-child ptrace anti-debug technique (verified 2026-08 against real
  # UnCrackable-Level2 libfoo.so, which exports ptrace+fork+getppid+waitpid):
  # a child forks and ptrace-attaches to detect a debugger. Requiring BOTH
  # ptrace AND fork (require_all) stops the false positive on the many apps
  # that import libc's ptrace for a benign reason (ADR-0006).

- id: native_su_binary_embedded
  category: root
  weight: 0.4
  pattern_type: embedded_string
  patterns:
    # Extraction bound (verified 2026-08 against the real corpus): analyze_so
    # invokes the `strings` tool with default flags (min printable length 4) -
    # see native.py analyze_so. A real libssl.so yields min-length 4 and zero
    # exact "su" strings. So a bare "su" pattern is UNREACHABLE: the strings
    # layer filters every 2-char string out before matching ever runs. It is
    # not kept (dead weight). "magisk" (7 chars) IS reachable and a real
    # systemless-root indicator; it is kept. Matching remains exact list
    # membership (pattern not in this_corpus) - not substring - so only full
    # path literals and "magisk" fire, never a substring of a benign symbol.
    # See tests/unit/test_native.py for the exact-membership + reachability
    # guarantees.
    - "/system/bin/su"
    - "/system/xbin/su"
    - "/data/adb/magisk"
    - "/data/adb/ksu"
    - "magisk"

- id: native_ssl_pinning_verify
  category: ssl
  weight: 0.5
  pattern_type: export_symbol
  patterns:
    - "Java_com_example_verify_cert"
    - "verify_certificate"
    - "checkCertificatePinning"

- id: native_pinning_embedded
  category: ssl
  weight: 0.3
  pattern_type: embedded_string
  patterns:
    - "certificate pinning"
    - "CertificatePinner"
