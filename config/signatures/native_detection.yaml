# Native signature rules (ADR-0008, roadmap item 5). Matched against each .so's
# dynamic export symbols and embedded strings by src/static/native.py.
# pattern_type: export_symbol (matches symbol names, incl. Java_* JNI exports)
#               | embedded_string (matches strings extracted from the .so)
# A rule that only matches at the bytecode/string layer has no native analogue -
# keep this file to techniques that actually show up in native exports/strings.

- id: native_jni_root_check
  category: root
  weight: 0.5
  pattern_type: export_symbol
  patterns:
    - "checkRoot"
    - "isRooted"
    # NOTE: this no longer carries `Java_com_example_*` placeholders - those were
    # example names no real app exports, so they could never fire (dead weight
    # that overclaimed detection surface). Real JNI exports are package- and
    # obfuscation-specific (e.g. UnCrackable-Level2 exports
    # Java_sg_vantagepoint_uncrackable2_CodeCheck_bar), so a general JNI *name*
    # rule cannot be written without overfitting to one corpus - hence this
    # signature keeps only the technique-level symbols and the generic anti-debug
    # combo is covered by native_ptrace_fork_antidebug below.

- id: native_ptrace_fork_antidebug
  category: root
  weight: 0.5
  pattern_type: export_symbol
  require_all: true
  patterns:
    - "ptrace"
    - "fork"
  # The fork-child ptrace anti-debug technique (verified 2026-08 against real
  # UnCrackable-Level2 libfoo.so, which exports ptrace+fork+getppid+waitpid):
  # a child forks and ptrace-attaches to detect a debugger. Requiring BOTH
  # ptrace AND fork (require_all) stops the false positive on the many apps
  # that import libc's ptrace for a benign reason (ADR-0006).

- id: native_build_props_probe
  category: root
  weight: 0.4
  pattern_type: embedded_string
  # A native test-keys root check embeds the build-props names it reads through
  # libc __system_property_get. These strings are > the strings-layer min length
  # (4) so they ARE reachable. Matching is exact list membership; firing only when
  # the literal is embedded in native code (a root-check signal, not a read of an
  # arbitrary prop). Routed to _native_build_props_hiding, which answers only the
  # root-indicating prop reads with the production value (ADR-0006).
  patterns:
    - "ro.build.tags"
    - "ro.build.type"

- id: native_su_binary_embedded
  category: root
  weight: 0.4
  pattern_type: embedded_string
  patterns:
    # Extraction bound (verified 2026-08 against the real corpus): analyze_so
    # invokes the `strings` tool with default flags (min printable length 4) -
    # see native.py analyze_so. A real libssl.so yields min-length 4 and zero
    # exact "su" strings. So a bare "su" pattern is UNREACHABLE: the strings
    # layer filters every 2-char string out before matching ever runs. It is
    # not kept (dead weight). "magisk" (7 chars) IS reachable and a real
    # systemless-root indicator; it is kept. Matching remains exact list
    # membership (pattern not in this_corpus) - not substring - so only full
    # path literals and "magisk" fire, never a substring of a benign symbol.
    # See tests/unit/test_native.py for the exact-membership + reachability
    # guarantees.
    - "/system/bin/su"
    - "/system/xbin/su"
    - "/data/adb/magisk"
    - "/data/adb/ksu"
    - "magisk"

- id: native_ssl_pinning_verify
  category: ssl
  weight: 0.5
  pattern_type: export_symbol
  patterns:
    - "Java_com_example_verify_cert"
    - "verify_certificate"
    - "checkCertificatePinning"

# Native SSL pinning is covered by native_ssl_pinning_verify (export symbols) and
# native_pinning_embedded (strings) above. OWASP UnCrackable-Level3 previously had
# a dedicated rule matching Java_sg_vantagepoint_uncrackable3_MainActivity_init/baz
# - REMOVED after verification: Ghidra decompilation of Level3's libfoo.so showed
# those exports are the secret/PIN mechanism, not TLS. baz is a stub that just
# returns a constant, and CodeCheck_bar does a byte-array secret compare; there is
# no X509/cert/pin logic anywhere in the decompiled native body. The rule matched a
# symbol name and manufactured a false SSL finding (0.70 -> BOTH) on a target with
# no pinning, and was dead for every real app anyway (overfit to one package) - a
# false positive AND unused logic, so it is removed rather than scoped. A real
# pinning lib exposes certificate logic in exports/strings/bodies, which the two
# generic rules above (and match_native's body matching via Ghidra, L-M6) catch.

- id: native_pinning_embedded
  category: ssl
  weight: 0.3
  pattern_type: embedded_string
  patterns:
    - "certificate pinning"
    - "CertificatePinner"

# Boundary-2 (native SSL): the canonical OpenSSL native certificate-pinning hook.
# SSL_CTX_set_cert_verify_callback installs a CUSTOM verification callback that
# overrides default chain validation - the unambiguous native pinning/verification
# idiom. It is statically visible as an IMPORTED libssl symbol (readelf -Ws
# includes imports, and match_native matches the export corpus), so a native
# pinning implementation is recoverable statically, not only at runtime.
# Only the callback form is SCORED (unambiguous); the generic SSL_CTX_set_verify /
# SSL_set_verify (present for SSL_VERIFY_NONE too) are NOT scored - they stay in
# the boundary-2 indicator layer as an unknown-native-TLS-capability signal so a
# NEITHER never over-claims (ADR-0006).
- id: native_ssl_custom_verify_callback
  category: ssl
  weight: 0.4
  pattern_type: export_symbol
  patterns:
    - "SSL_CTX_set_cert_verify_callback"

# Native Frida/instrumentation-detection strings (2026). The Java layer already
# detects the Frida/Substrate packages (root_detection.yaml frida_detection /
# cydia_substrate_detection); this closes the native blind spot: apps that probe
# for instrumentation from C/C++ embed the Frida artifacts as .so strings and
# scan /proc/self/maps for them. These literals are structurally distinctive
# (a real app does not ship "frida-server"/"gum-js-loop"/"linjector" for a benign
# reason) and all exceed the `strings` min-length-4 extraction bound, so they are
# reachable as exact embedded-string matches (native.py analyze_so). Same
# ADR-0006 discipline as native_su_binary_embedded: exact membership, not
# substring; corroborative anti-instrumentation weight.
- id: native_frida_detection
  category: root
  weight: 0.4
  pattern_type: embedded_string
  patterns:
    - "frida-server"
    - "re.frida.server"
    - "frida-gadget"
    - "gum-js-loop"
    - "linjector"
    - "libfrida.so"

# NOTE: the modern BoringSSL custom-verify API (SSL_CTX_set_custom_verify /
# SSL_set_custom_verify) and the Xamarin/Mono runtime are deliberately NOT scored
# signatures here. Verified against real production apps (Netflix libcronet.so
# bundles BoringSSL yet strips every verify symbol): production BoringSSL/Mono
# strips or renames these symbols, so an export_symbol signature cannot fire on a
# shipping app, and scoring it would over-claim detection. They live in the
# boundary-2 native indicator layer (static/indicators.py) instead, surfacing the
# app as coverage-limited rather than a confident negative (ADR-0006).

# --- 2026 corpus broadening ---
# Magisk/KernelSU hide-layer artifacts surface natively when app code inspects or
# fights the hide layer; resetprop/magiskpolicy and the /data/adb daemon paths
# are strong embedded-string signals.
- id: native_root_hide_artifacts
  category: root
  weight: 0.4
  pattern_type: embedded_string
  patterns:
    # /data/adb/magisk and /data/adb/ksu deliberately omitted - native_su_binary_embedded
    # already matches both, so repeating them here would double-weight one path.
    - "resetprop"
    - "magiskpolicy"
    - "ksud"

# Magisk init / Zygisk injection artifacts surfacing natively in app .so strings -
# the app inspects or is built aware of the systemless root hook layer.
- id: native_magisk_init_injection
  category: root
  weight: 0.4
  pattern_type: embedded_string
  patterns:
    - "magiskinit"
    - "zygisk"
    - "init.magisk.rc"
    - "libzygisk.so"

# Native /proc/mounts parsing for overlayfs/rw-system - the native analog of the
# java overlayfs_system signature.
- id: native_proc_mounts_check
  category: root
  weight: 0.4
  pattern_type: embedded_string
  patterns:
    - "/proc/self/mounts"
    - "/proc/mounts"
    - "overlayfs"

# Native Magisk-daemon socket scan - the native analog of the java
# magisk_daemon_socket_scan, common in hardened native detectors.
- id: native_daemon_socket_scan
  category: root
  weight: 0.4
  pattern_type: embedded_string
  patterns:
    - "@magisk_service"
    - "/proc/net/unix"
    - "@ksu_"
