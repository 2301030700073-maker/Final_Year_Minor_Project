# Native signature rules (ADR-0008, roadmap item 5). Matched against each .so's
# dynamic export symbols and embedded strings by src/static/native.py.
# pattern_type: export_symbol (matches symbol names, incl. Java_* JNI exports)
#               | embedded_string (matches strings extracted from the .so)
# A rule that only matches at the bytecode/string layer has no native analogue -
# keep this file to techniques that actually show up in native exports/strings.

- id: native_jni_root_check
  category: root
  weight: 0.5
  pattern_type: export_symbol
  patterns:
    - "Java_com_example_check_root"
    - "checkRoot"
    - "isRooted"

- id: native_su_binary_embedded
  category: root
  weight: 0.4
  pattern_type: embedded_string
  patterns:
    # CORRECTION (2026-08): an earlier commit claimed a bare "su"/"magisk"
    # embedded_string pattern false-positives on any stock lib, citing 65
    # "su"-containing strings in a benign libssl.so (EVP_PKEY_decapsulate,
    # SSL_*_subjects_to_stack, ...). That claim was WRONG: native matching is
    # exact list membership (pattern not in this_corpus), not substring - so a
    # bare "su" only fires on a string exactly equal to "su" and never touches
    # "EVP_PKEY_decapsulate". The "FP fix" was premised on a false substring
    # model and silently dropped a weak-but-real exact signal (a lib embedding
    # the literal "su", e.g. in an access("su") probe). Both bare literals are
    # restored below. The genuine strengthening from that commit - the modern
    # systemless-root full paths, exact-match and structurally unlikely - is
    # kept. See tests/unit/test_native.py for the exact-membership guarantee.
    - "/system/bin/su"
    - "/system/xbin/su"
    - "/data/adb/magisk"
    - "/data/adb/ksu"
    - "su"
    - "magisk"

- id: native_ssl_pinning_verify
  category: ssl
  weight: 0.5
  pattern_type: export_symbol
  patterns:
    - "Java_com_example_verify_cert"
    - "verify_certificate"
    - "checkCertificatePinning"

- id: native_pinning_embedded
  category: ssl
  weight: 0.3
  pattern_type: embedded_string
  patterns:
    - "certificate pinning"
    - "CertificatePinner"
