# Root-detection signatures for Phase 1 (UnCrackable1).
#
# root_su_binary_paths, root_build_tags_test_keys, root_runtime_exec_su,
# rootbeer_framework, and su_management_apps were the original starter
# set. root_su_via_path_env_check and root_known_indicator_files were
# added after reading the real decompiled UnCrackable1 source pulled
# from a collaborator run (sg/vantagepoint/a/c.java) - the app's actual
# su-path check builds the path dynamically at runtime
# (`new File(str, "su").exists()` over a PATH split), so the literal
# string "/system/bin/su" never appears in the bytecode; a separate
# check tests a hardcoded array of 7 known root-indicator file paths
# that had no corresponding signature at all before this. Both new
# patterns are quoted verbatim against the real code, not guessed.
# The empirical gate was confirmed in round 2: a real pipeline re-run
# flipped classification to ROOT_ONLY at 0.80 confidence, consistently
# across runs.
#
# Phase 2 (UnCrackable2): the same three checks reappear byte-for-byte
# identical in sg/vantagepoint/a/b.java (just a different class name -
# same PATH-split su lookup / test-keys / 7-path indicator array) -
# confirmed against the real decompiled source. Zero new signature
# entries needed, since matching here is content-based, not tied to any
# class name. UnCrackable2's genuinely new anti-debugging check (a
# background Debug.isDebuggerConnected() poll) is deliberately NOT a
# signature here - it's neither root-detection nor SSL-pinning, and
# folding it into this category's confidence score would misrepresent
# what's actually being measured (see docs/plans/handoff/phase-2-handoff.md).
#
# Phase 3 (UnCrackable3): the same three checks reappear again, still
# byte-for-byte identical, now in sg/vantagepoint/util/RootDetection.java
# as checkRoot1/checkRoot2/checkRoot3 - zero new signature entries needed.
# Empirically confirmed at 0.80 confidence (ROOT_ONLY) on a real baseline
# run against this exact APK - see
# docs/plans/handoff/bundles/20260729T163713Z/. This app also has a
# CRC32-based anti-tampering check (MainActivity.verifyLibs()) - same as
# Phase 2's anti-debug poll, deliberately NOT a signature here either, see
# docs/plans/handoff/phase-3-handoff.md.

- id: root_su_binary_paths
  category: root
  weight: 0.3
  pattern_type: string_literal
  patterns:
    - "/system/bin/su"
    - "/system/xbin/su"
    - "/sbin/su"
  evidence_type: bytecode_string

- id: root_build_tags_test_keys
  category: root
  weight: 0.2
  pattern_type: string_literal
  patterns:
    - "test-keys"
  evidence_type: bytecode_string

- id: root_runtime_exec_su
  category: root
  weight: 0.3
  pattern_type: regex
  patterns:
    # Linearized against catastrophic backtracking (ReDoS). The former
    # '.*su.*' had two unanchored .* - on a long line of repeated su tokens
    # with no closing paren, the regex backtracks quadratically (verified:
    # 10-47s on a hostile 1MB line, a silent hang). The trailing '\)' was the
    # remaining hazard (matching a paren that may not exist re-scans the whole
    # remainder per candidate), so it is dropped: '[^)]*' naturally stops at
    # the first ')' and so still guarantees 'su' appears inside exec()'s own
    # argument list, while a single [^)]* + literal 'su' is a linear scan
    # (verified 0.0001s on the same hostile input, 0.002s worst-case no-su).
    # A per-line budget in scan() (signatures.py) backs this up so no future
    # regex can re-hang it silently.
    #
    # Corpus coverage (verified 2026-08 against the real decompiled targets):
    # every real Runtime.exec-su form matches - exec("su"), and the three
    # exec(new String[]{...}) array forms ({"su", ...}, {"/system/bin/which",
    # "su"}, {"which", "su"}). None of these place a ')' before the su token,
    # so the single [^)]* reaches it linearly. A hypothetical exec(getUser(),
    # "su") with a nested method-call argument would NOT match - but that form
    # is absent from the corpus and cannot be caught by any single linear
    # regex (balanced-paren matching is non-regular); the command-slot and
    # array-slot forms above are the real detection surface. Do NOT "improve"
    # this to exec\(\s*"[^"]*su: it drops the new String[] forms (the leading
    # token is 'new', not a quote) and would be a regression, not a fix.
    - 'Runtime\.getRuntime\(\)\.exec\([^)]*su'
    # EXEC-RECV1 (measured 2026-09-03): the pattern above hard-requires the
    # INLINE receiver, so a Runtime cached in a field or local is invisible.
    # Sentry's own root checker does exactly that - RootChecker holds
    # `private final Runtime runtime` (injected in the constructor as
    # Runtime.getRuntime()) and checkSUExist() calls
    # `this.runtime.exec(new String[]{"/system/xbin/which", "su"})`. That is a
    # textbook `which su` probe inside a commercially shipped, purpose-built
    # root checker, and it scored NOTHING: of the four techniques that class
    # implements, test-keys (root_build_tags_test_keys), its 12-entry su-path
    # array (root_su_binary_paths / su_alternate_binary_paths /
    # root_known_indicator_files) and its root-package list
    # (su_management_apps / root_cloaking_detection) all matched - only the exec
    # probe was missed, purely because of how the receiver was spelled.
    #
    # Receiver-agnostic by design, and FP-bounded by measurement rather than by
    # assertion: across every *.java in the decompiled corpus, EVERY `.exec(`
    # call whose argument list contains "su" is a root check - 10x
    # {"/system/xbin/which","su"}, 1x {"/system/bin/which","su"}, 2x
    # {"su","ls /data/data/"}, 1x exec("su"). Fourteen hits, zero false
    # positives, so the receiver adds no discriminating power while excluding
    # real detections.
    #
    # The quote+boundary is what keeps it that way: '"su(?:"|\s)' requires su to
    # be a QUOTED command token (closing quote, or a space as in "su -c id").
    # A bare [^)]*su would match .exec("subscribe")/("summary"); requiring the
    # opening quote alone would still match "subscribe". Linear like its sibling
    # (one [^)]* then literals) so the ReDoS hardening documented above holds.
    #
    # This is an ADDED PATTERN on the EXISTING id, never a new id: confidence
    # sums DISTINCT signature ids, so extending the list is recall-only. A new
    # id here would double-count the same technique in every app that already
    # matches the inline form (all 4 UnCrackable/AndroGoat-class targets), which
    # is how an anti-FP invariant gets eroded by an apparent recall win.
    - '\.exec\([^)]*"su(?:"|\s)'
  evidence_type: bytecode_string

- id: rootbeer_framework
  category: root
  weight: 0.5
  pattern_type: class_reference
  patterns:
    - "com.scottyab.rootbeer"
  evidence_type: bytecode_class

- id: su_management_apps
  category: root
  weight: 0.2
  pattern_type: string_literal
  patterns:
    - "com.noshufou.android.su"
    - "eu.chainfire.supersu"
    # Magisk - the dominant 2026 manager (added Phase 4). Its package name can
    # be randomized by the user, so absence of this literal is NOT evidence of
    # no Magisk; presence is a genuine root-management signal. Same weight as
    # the SuperSU-era managers it joins.
    - "com.topjohnwu.magisk"
    # The rest of the OWASP-MSTG reference `detectRootManagementApps` list that
    # was still missing (added 2026-08, web-grounded): the classic Koushik Dutta
    # Superuser package (previously only the /dev/...superuser.daemon path was
    # matched, not the package an app actually queries via getInstalledPackages),
    # its ROM-manager sibling, and the remaining SuperSU-clone packages apps
    # check by name. Each is a specific root-manager identifier - matching one
    # requires the app to genuinely query for it (MSTG-RESILIENCE-1). The
    # package-name technique is "necessary but insufficient" (Magisk can rename
    # its package), so these stay corroborative at the same modest weight, not
    # decisive.
    - "com.koushikdutta.superuser"
    - "com.koushikdutta.rommanager"
    - "com.thirdparty.superuser"
    - "com.dimon.laptop.tablet2.honeycomb"
    # KingRoot / Kingo Root - two mass-market one-click root managers still
    # widely probed for in 2026 root detection. Verified 2026-08 by DEX
    # extraction: both exact package strings are present in a shipping build of
    # Facebook (571.0.0.44.73), embedded as constants its root check queries.
    # Same corroborative weight and rationale as the SuperSU-era managers above
    # (package can be absent without ruling out root; presence is a real signal).
    - "com.kingroot.kinguser"
    - "com.kingo.root"
  evidence_type: bytecode_string

- id: root_su_via_path_env_check
  category: root
  weight: 0.3
  pattern_type: regex
  patterns:
    - 'new File\([^,]+,\s*"su"\)\.exists\(\)'
  evidence_type: bytecode_string

# SUDIR1 (2026-09-03). The corpus could not see the single most-copied root
# check on the internet: a hardcoded array of su SEARCH DIRECTORIES, walked
# with the binary name concatenated on at runtime -
#   String[] places = {"/sbin/", "/system/bin/", "/system/xbin/", ...};
#   for (String where : places) if (new File(where + binaryName).exists()) ...
#   isRooted() { return findBinary("su"); }
# Every su-path signature above needs a FULL path literal ("/system/xbin/su"),
# and root_su_via_path_env_check needs the two-arg `new File(dir, "su")` form.
# This idiom produces neither: the only literals in the bytecode are bare
# directories with a trailing slash, plus a standalone "su".
#
# Found by scanning for app-owned files where the indicator layer fires but no
# signature matches. Measured, real false negative: RS_Vapour
# (com.redshift.rs_vapourtraining, 1c747b27) scored root 0.00 while its own
# Login.java gates login on isRooted() and Toasts "Phone is rooted, Please
# uninstall application.". DEX-verified in APK_Test/RS_Vapour.apk - all eight
# directory literals and the standalone "su" are exact DEX string constants
# whose get_xref_from() resolves to Lcom/redshift/rs_vapourtraining/Login;,
# the app's OWN class - while "/system/bin/su", "/system/xbin/su", "/sbin/su",
# "/data/local/xbin/su", "/system/app/Superuser.apk", "test-keys" and "magisk"
# are all ABSENT (no path-like string containing "su" exists in the whole DEX).
# The same blind spot had also produced a WRONG ground-truth label: that APK
# was registered root:false on a verification that grepped full su paths. Both
# are fixed - see the CORRECTED entry in config/ground_truth.yaml.
#
# Why regex, not string_literal: string_literal matching is substring-based
# (signatures.py _match_line), so a bare "/system/xbin/" pattern would also
# match "/system/xbin/daemonsu" (root_known_indicator_files),
# "/system/xbin/busybox" (busybox_binary_paths) and "/system/xbin/sudo"
# (su_alternate_binary_paths) - three OTHER signature IDs. Since confidence
# sums distinct IDs, that would silently inflate every already-detected app
# by 0.3 for one technique counted twice. The (?![\w.]) boundary requires the
# literal to END at the directory slash, which is what actually distinguishes
# this idiom, and makes the pattern non-colliding by construction. It also
# works on all three scan surfaces (jadx/CFR Java, smali, raw DEX strings)
# rather than depending on the source quoting, and is linear - a literal
# prefix plus a zero-width single-char lookahead, no backtracking.
#
# False-positive measurement (not asserted - grepped, whole analysed corpus,
# every *.java and *.smali under outputs/analysis): the bare-directory form
# occurs in exactly TWO code sites. RS_Vapour's Login (all eight, app-owned
# root check) and Telegram's org/telegram/messenger/EmuDetector (only
# "/system/bin/"). Nothing else in the corpus contains any of them, so ZERO
# already-detected app gains weight from this signature and no app can double
# count it against a full-path signature.
#
# Deliberately EXCLUDED, measured: "/system/bin/", "/sbin/" and "/data/local/"
# are generic enough to appear outside a root check - "/system/bin/" is
# Telegram's EmuDetector, which is emulator detection, and scoring it as a
# su-binary-path probe would mislabel it. All three occur only INSIDE
# RS_Vapour's array anyway, so excluding them costs zero recall. "/su/bin/",
# "/system/bin/.ext/" and "/system/usr/we-need-root/" are standard RootBeer
# suPaths entries but occur ZERO times in bare-directory form anywhere in the
# corpus, so they are not added - five verified additions, not eight.
#
# Honest bound on what this fixes: RS_Vapour's app-owned root surface is ONE
# technique (of its 111 app-owned string constants, the only root-shaped ones
# are these directories, "su", and the Toast text). One matched signature at
# 0.3 cannot reach the 0.70 DETECTED threshold, and no single signature may
# ever carry >= 0.70 (the structural anti-FP invariant). So this signature
# moves RS_Vapour from a silent 0.00 to 0.30 with real Evidence rows naming
# its own Login class, but the verdict stays NEITHER - correctly reported as
# coverage-limited "unknown, not absent" by the indicator layer, not as a
# confident negative. It remains a measured false negative against the
# corrected label. A user-facing "Phone is rooted" string was considered as a
# second signal and REJECTED: that is evidence of intent, not a detection
# technique, and scoring it would blend evidence classes and inflate every
# already-detected app (UnCrackable1/2, AndroGoat, InsecureBankv2 all ship
# one) to manufacture a threshold crossing. Same reasoning that keeps
# UnCrackable2's anti-debug poll and UnCrackable3's CRC32 check out of this
# file.
- id: root_su_search_directories
  category: root
  weight: 0.3
  pattern_type: regex
  patterns:
    - '/system/xbin/(?![\w.])'
    - '/data/local/xbin/(?![\w.])'
    - '/data/local/bin/(?![\w.])'
    - '/system/sd/xbin/(?![\w.])'
    - '/system/bin/failsafe/(?![\w.])'
  evidence_type: bytecode_string

- id: root_known_indicator_files
  category: root
  weight: 0.3
  pattern_type: string_literal
  patterns:
    - "/system/app/Superuser.apk"
    - "/system/xbin/daemonsu"
    - "/system/etc/init.d/99SuperSUDaemon"
    - "/system/bin/.ext/.su"
    - "/system/etc/.has_su_daemon"
    - "/system/etc/.installed_su_daemon"
    - "/dev/com.koushikdutta.superuser.daemon/"
  evidence_type: bytecode_string

# --- Magisk / KernelSU / Zygisk era (Phase 4, web-grounded 2026) ---
#
# The seven signatures above describe the 2015 SuperSU root model. Modern
# Android (2026) is dominated by Magisk (systemless), KernelSU, and APatch.
# Each signature below targets a real 2026 detection technique, web-verified.
# Per-signature FP analysis follows each entry (the same discipline
# okhttp_certificate_pinner documents): bare "/data/adb" or "magisk" fragments
# are deliberately NOT used - those strings appear in benign telemetry and
# library code - only full, structurally-unlikely paths and SELinux contexts
# are matched, so a false positive requires the app to genuinely probe for a
# systemless-root artifact. These are NOT yet validated against a Magisk
# corpus (none is available on the reference device); ADR-0006 governs - the
# calibration loop must re-measure precision/recall when a Magisk-rooted
# target is added, and only then does this expansion earn empirical trust.
#
# Over-trust warning (the honest reading of these signatures): the engine is
# additive-only - confidence can only rise when a signature matches. It can
# never express "clean BUT hardened." A 2026 banking app relying solely on
# Play Integrity attestation (the dominant hardening path) statically scans
# clean at 0.0 confidence, yet is precisely the app where absence of a root
# signature means the least. A clean static result on such a target is NOT
# evidence of absence of root; treat it as "no known indicator found," not
# "confirmed clean." Consistent with ADR-0008 - a negative must never over-
# trust a surface it could not actually scan.
#
# Label semantics (what ROOT_ONLY means): a match means "the app references a
# root artifact in a way consistent with root DETECTION." Root-file-manager /
# module-enumeration apps (MT Manager, MiXplorer root mode, "installed Magisk
# modules" listers) hardcode these same paths to enumerate state, not to
# detect root, and would be mislabeled ROOT_ONLY. No such app is in the
# validated corpus (which is exactly why zero-FP held); if one is ever added,
# a fixture must accompany it so the label semantics stay honest.

- id: magisk_su_binary_paths
  category: root
  weight: 0.3
  pattern_type: string_literal
  patterns:
    - "/data/adb/magisk/magisk"
    - "/data/adb/magisk/su"
    - "/data/adb/magisk/busybox"
  evidence_type: bytecode_string

- id: magisk_selinux_context
  category: root
  weight: 0.4
  pattern_type: string_literal
  patterns:
    - "u:r:magisk:s0"
  evidence_type: bytecode_string

- id: kernelsu_binary_paths
  category: root
  weight: 0.3
  pattern_type: string_literal
  patterns:
    # /data/adb/ksud is a strict substring of /data/adb/ksu (matching already
    # covers it), so it would add zero distinct matches - dropped as redundant.
    - "/data/adb/ksu"
    # SUSFS (susfs4ksu, the 2025-26 kernel-side hiding layer for KernelSU) ships
    # two userspace helpers that its own module README states are installed "into
    # /data/adb/ksu": ksu_susfs and sus_su. Only the first is listed here, for two
    # separate reasons:
    #  - it is NOT redundant with the directory literal above. An app that probes
    #    the full path /data/adb/ksu/ksu_susfs already matches on the directory,
    #    but one that looks up the bare helper name (a PATH/which-style probe, or
    #    a /proc or mount-table string comparison) carries no /data/adb/ksu
    #    substring at all, so the directory pattern cannot reach it.
    #  - "sus_su" is deliberately NOT added: as a substring it is reachable from
    #    ordinary English compounds - "census_survey" and "consensus_subset" both
    #    contain sus_su - so a bare literal would be a false-positive vector in
    #    analytics/localization strings, and the only safe spelling
    #    (/data/adb/ksu/sus_su) is already subsumed by the directory literal.
    # /data/adb/susfs* is not listed either: the module's documentation does not
    # state any such path, and this corpus does not assert identifiers it has not
    # read from the source.
    - "ksu_susfs"
  evidence_type: bytecode_string

- id: zygisk_artifact_paths
  category: root
  weight: 0.3
  pattern_type: string_literal
  patterns:
    # /data/adb/modules/zygisk_ (the per-module prefix) is subsumed by the
    # directory literal above it - dropped as redundant.
    - "/data/adb/modules/zygisk"
    - "/data/adb/magisk/zygisk"
  evidence_type: bytecode_string

- id: magisk_denylist_artifacts
  category: root
  weight: 0.3
  pattern_type: string_literal
  patterns:
    - "/data/adb/denylist"
    - "/data/adb/magisk/denylist.db"
  evidence_type: bytecode_string

# --- Root-cloaking detection era (2026, web-grounded) ---
#
# Distinct from magisk_denylist_artifacts / magisk_module_dirs above: those fire
# when the app itself OWNS or READS the denylist/module paths. This category fires
# when the app PROBES for the root-hiding FRAMEWORKS - MagiskHide (Magisk's built-in
# hide), Shamiko (the Zygisk hide module), RootCloak / HideMyRoot (Xposed hide
# modules), suhide (the hide module/tool). An app that scans for a cloaking
# framework is ITSELF root-aware - it cannot otherwise know to look. Each token is
# a structurally-unlikely product/framework name, so matching one requires the app
# to genuinely reference a hide framework; bare generic words ("hide", "deny") are
# deliberately NOT included (low signal). Absence is NOT evidence of no root.
- id: root_cloaking_detection
  category: root
  weight: 0.3
  pattern_type: string_literal
  # case_sensitive: false (2026-09-04). The per-spelling note below found that a
  # mixed-case display literal misses the lowercase spelling an app actually
  # probes - and then fixed it for RootCloak alone. The same hole was open for
  # every other literal here: "Shamiko" did not match `shamiko`, which is exactly
  # how the module is spelled on disk (/data/adb/modules/shamiko), and the same
  # applies to MagiskHide/HideMyRoot. Folding case fixes the whole class instead
  # of one spelling at a time, and costs nothing: none of these literals is an
  # English word, so a case-insensitive match cannot reach benign text.
  case_sensitive: false
  patterns:
    - "MagiskHide"
    - "Shamiko"
    - "RootCloak"
    - "HideMyRoot"
    - "suhide"
    # RootCloak is probed for by its Xposed module PACKAGE names, not the
    # display string "RootCloak" above - a different string, not just a different
    # casing, so folding case does not make these redundant. Verified 2026-08 by
    # DEX extraction: PropertyGuru (2026.5.4) embeds both package constants below
    # and zero occurrences of mixed-case "RootCloak", so the display literal
    # misses this real probe; these package forms close that gap.
    - "com.devadvance.rootcloak"
    - "com.devadvance.rootcloakplus"
  evidence_type: bytecode_string

# --- Play Integrity / SafetyNet attestation era (2026) ---
#
# The header above names Play Integrity attestation as the dominant modern
# hardening path - and notes that an app relying solely on it previously scanned
# at 0.0 confidence, invisible to the path/artifact signatures. These two make
# the engine ABLE to see that path: they fire on the app's OWN call into the
# attestation API, so a Play-Integrity-only app now yields a real (moderate)
# root/device-integrity signal instead of a silent clean.
#
# FP analysis (the same discipline the Magisk entries document): the matched
# strings (requestIntegrityToken / requestAttestation) appear in the APP's own
# code whenever it invokes attestation, and the app package is never third-party-
# excluded. Google's own SDK plumbing (com.google.*) IS excluded by the vendor
# taxonomy, so the SDK's internal IntegrityManager/SafetyNet references do not
# inflate the app's confidence - only the app's own call does. Absence remains
# NOT evidence of no root (attestation is optional hardening); presence is a
# genuine device-integrity/root-detection signal.
#
# ADR-0006 caveat (unchanged from the Magisk entries): not yet validated against
# a Play-Integrity corpus on the reference device - the calibration loop must
# re-measure precision/recall when such a target is added.

- id: play_integrity_attestation
  category: root
  weight: 0.3
  pattern_type: string_literal
  patterns:
    - "requestIntegrityToken"
    - "IntegrityTokenResponse"
    # The verdict-flag literals the app compares against the integrity response
    # (2026-08, A3 corpus-currency): MEETS_DEVICE_INTEGRITY / MEETS_STRONG_INTEGRITY
    # are the returned verdict constants, DEVICE_INTEGRITY / STRONG_INTEGRITY /
    # BASIC_INTEGRITY the request flags - all Play-Integrity-specific tokens that
    # only appear when the app actually gates on attestation (they are in the
    # app's own call, never vendor-excluded). Same FP discipline as the rest of
    # this entry.
    - "MEETS_DEVICE_INTEGRITY"
    - "MEETS_STRONG_INTEGRITY"
    - "DEVICE_INTEGRITY"
    - "STRONG_INTEGRITY"
    - "BASIC_INTEGRITY"
  evidence_type: bytecode_string

- id: safetynet_attestation
  category: root
  weight: 0.3
  pattern_type: string_literal
  patterns:
    - "requestAttestation"
    - "com.google.android.gms.safetynet"
  evidence_type: bytecode_string

# --- Play Integrity Standard / Application API (2026, corpus-currency) ---
# Beyond the classic requestIntegrityToken() API above, Play Integrity split into a
# *Standard* request flow: the app builds an IntegrityTokenRequest, calls
# requestStandardIntegrityToken() (or prepares via prepareIntegrityToken()), and
# receives the verdict via a StandardIntegrityManager. The class/method names
# (StandardIntegrityManager, requestStandardIntegrityToken, prepareIntegrityToken)
# and the canonical FQCN com.google.android.play.core.integrity.StandardIntegrityManager
# are Play-Integrity-specific - they only appear when the app gates on attestation,
# and are never vendor-excluded. Same FP discipline as play_integrity_attestation.
- id: play_integrity_standard_attestation
  category: root
  weight: 0.3
  pattern_type: string_literal
  patterns:
    - "StandardIntegrityManager"
    - "requestStandardIntegrityToken"
    - "prepareIntegrityToken"
    - "com.google.android.play.core.integrity.StandardIntegrityManager"
  evidence_type: bytecode_string

# --- APatch / KernelSU manager / BusyBox / root-tool era (2026, web-grounded) ---
#
# Gaps the 2020-era Magisk/SuperSU taxonomy left: APatch (2024+) and the KernelSU
# manager package had no signature, BusyBox (the root-enabler RootBeer's
# checkForBusyBoxBinary detects) was absent, and the package of the classic root
# tool Lucky Patcher was unmatched. Each is a specific, structurally-unlikely
# identifier - matching one requires the app to genuinely reference a root
# artifact, keeping false positives low. Same ADR-0006 discipline as the Magisk
# entries: not yet validated against an APatch/KernelSU corpus on the reference
# device; additive only, never overclaimed. The APatch and KernelSU MANAGER
# packages can be renamed like Magisk, so absence is NOT evidence of no root -
# presence is a genuine root-management signal.
#
# SELinux access probe (DirtySepolicy / Duck Detector, 2026): the detection
# frontier moved from user-space file/process hiding to kernel-layer SELinux
# policy queries. An app calls SELinux.checkSELinuxAccess() to ask whether an
# untrusted_app -> magisk/ksu/lsposed context transition is allowed - a root /
# root-cloaking signal a path check cannot see (the artifact is hidden). The API
# call is the probe, so matching the method reference limits false positives to
# code that genuinely queries SELinux policy. Moderate weight - some legit apps
# query SELinux for unrelated reasons, so this is corroborative, not decisive.

- id: apatch_binary_paths
  category: root
  weight: 0.3
  pattern_type: string_literal
  patterns:
    # The base directory, not the three sub-paths this list used to name
    # (/data/adb/apd, /data/adb/ap/bin, /data/adb/ap/package_config). Measured
