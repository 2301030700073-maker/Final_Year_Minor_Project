# Root-detection signatures for Phase 1 (UnCrackable1).
#
# root_su_binary_paths, root_build_tags_test_keys, root_runtime_exec_su,
# rootbeer_framework, and su_management_apps were the original starter
# set. root_su_via_path_env_check and root_known_indicator_files were
# added after reading the real decompiled UnCrackable1 source pulled
# from a collaborator run (sg/vantagepoint/a/c.java) - the app's actual
# su-path check builds the path dynamically at runtime
# (`new File(str, "su").exists()` over a PATH split), so the literal
# string "/system/bin/su" never appears in the bytecode; a separate
# check tests a hardcoded array of 7 known root-indicator file paths
# that had no corresponding signature at all before this. Both new
# patterns are quoted verbatim against the real code, not guessed.
# The empirical gate was confirmed in round 2: a real pipeline re-run
# flipped classification to ROOT_ONLY at 0.80 confidence, consistently
# across runs.
#
# Phase 2 (UnCrackable2): the same three checks reappear byte-for-byte
# identical in sg/vantagepoint/a/b.java (just a different class name -
# same PATH-split su lookup / test-keys / 7-path indicator array) -
# confirmed against the real decompiled source. Zero new signature
# entries needed, since matching here is content-based, not tied to any
# class name. UnCrackable2's genuinely new anti-debugging check (a
# background Debug.isDebuggerConnected() poll) is deliberately NOT a
# signature here - it's neither root-detection nor SSL-pinning, and
# folding it into this category's confidence score would misrepresent
# what's actually being measured (see docs/plans/handoff/phase-2-handoff.md).
#
# Phase 3 (UnCrackable3): the same three checks reappear again, still
# byte-for-byte identical, now in sg/vantagepoint/util/RootDetection.java
# as checkRoot1/checkRoot2/checkRoot3 - zero new signature entries needed.
# Empirically confirmed at 0.80 confidence (ROOT_ONLY) on a real baseline
# run against this exact APK - see
# docs/plans/handoff/bundles/20260729T163713Z/. This app also has a
# CRC32-based anti-tampering check (MainActivity.verifyLibs()) - same as
# Phase 2's anti-debug poll, deliberately NOT a signature here either, see
# docs/plans/handoff/phase-3-handoff.md.

- id: root_su_binary_paths
  category: root
  weight: 0.3
  pattern_type: string_literal
  patterns:
    - "/system/bin/su"
    - "/system/xbin/su"
    - "/sbin/su"
  evidence_type: bytecode_string

- id: root_build_tags_test_keys
  category: root
  weight: 0.2
  pattern_type: string_literal
  patterns:
    - "test-keys"
  evidence_type: bytecode_string

- id: root_runtime_exec_su
  category: root
  weight: 0.3
  pattern_type: regex
  patterns:
    # Linearized against catastrophic backtracking (ReDoS). The former
    # '.*su.*' had two unanchored .* - on a long line of repeated su tokens
    # with no closing paren, the regex backtracks quadratically (verified:
    # 10-47s on a hostile 1MB line, a silent hang). The trailing '\)' was the
    # remaining hazard (matching a paren that may not exist re-scans the whole
    # remainder per candidate), so it is dropped: '[^)]*' naturally stops at
    # the first ')' and so still guarantees 'su' appears inside exec()'s own
    # argument list, while a single [^)]* + literal 'su' is a linear scan
    # (verified 0.0001s on the same hostile input, 0.002s worst-case no-su).
    # A per-line budget in scan() (signatures.py) backs this up so no future
    # regex can re-hang it silently.
    - 'Runtime\.getRuntime\(\)\.exec\([^)]*su'
  evidence_type: bytecode_string

- id: rootbeer_framework
  category: root
  weight: 0.5
  pattern_type: class_reference
  patterns:
    - "com.scottyab.rootbeer"
  evidence_type: bytecode_class

- id: su_management_apps
  category: root
  weight: 0.2
  pattern_type: string_literal
  patterns:
    - "com.noshufou.android.su"
    - "eu.chainfire.supersu"
    # Magisk - the dominant 2026 manager (added Phase 4). Its package name can
    # be randomized by the user, so absence of this literal is NOT evidence of
    # no Magisk; presence is a genuine root-management signal. Same weight as
    # the SuperSU-era managers it joins.
    - "com.topjohnwu.magisk"
  evidence_type: bytecode_string

- id: root_su_via_path_env_check
  category: root
  weight: 0.3
  pattern_type: regex
  patterns:
    - 'new File\([^,]+,\s*"su"\)\.exists\(\)'
  evidence_type: bytecode_string

- id: root_known_indicator_files
  category: root
  weight: 0.3
  pattern_type: string_literal
  patterns:
    - "/system/app/Superuser.apk"
    - "/system/xbin/daemonsu"
    - "/system/etc/init.d/99SuperSUDaemon"
    - "/system/bin/.ext/.su"
    - "/system/etc/.has_su_daemon"
    - "/system/etc/.installed_su_daemon"
    - "/dev/com.koushikdutta.superuser.daemon/"
  evidence_type: bytecode_string

# --- Magisk / KernelSU / Zygisk era (Phase 4, web-grounded 2026) ---
#
# The seven signatures above describe the 2015 SuperSU root model. Modern
# Android (2026) is dominated by Magisk (systemless), KernelSU, and APatch.
# Each signature below targets a real 2026 detection technique, web-verified.
# Per-signature FP analysis follows each entry (the same discipline
# okhttp_certificate_pinner documents): bare "/data/adb" or "magisk" fragments
# are deliberately NOT used - those strings appear in benign telemetry and
# library code - only full, structurally-unlikely paths and SELinux contexts
# are matched, so a false positive requires the app to genuinely probe for a
# systemless-root artifact. These are NOT yet validated against a Magisk
# corpus (none is available on the reference device); ADR-0006 governs - the
# calibration loop must re-measure precision/recall when a Magisk-rooted
# target is added, and only then does this expansion earn empirical trust.
#
# Over-trust warning (the honest reading of these signatures): the engine is
# additive-only - confidence can only rise when a signature matches. It can
# never express "clean BUT hardened." A 2026 banking app relying solely on
# Play Integrity attestation (the dominant hardening path) statically scans
# clean at 0.0 confidence, yet is precisely the app where absence of a root
# signature means the least. A clean static result on such a target is NOT
# evidence of absence of root; treat it as "no known indicator found," not
# "confirmed clean." Consistent with ADR-0008 - a negative must never over-
# trust a surface it could not actually scan.
#
# Label semantics (what ROOT_ONLY means): a match means "the app references a
# root artifact in a way consistent with root DETECTION." Root-file-manager /
# module-enumeration apps (MT Manager, MiXplorer root mode, "installed Magisk
# modules" listers) hardcode these same paths to enumerate state, not to
# detect root, and would be mislabeled ROOT_ONLY. No such app is in the
# validated corpus (which is exactly why zero-FP held); if one is ever added,
# a fixture must accompany it so the label semantics stay honest.

- id: magisk_su_binary_paths
  category: root
  weight: 0.3
  pattern_type: string_literal
  patterns:
    - "/data/adb/magisk/magisk"
    - "/data/adb/magisk/su"
    - "/data/adb/magisk/busybox"
  evidence_type: bytecode_string

- id: magisk_selinux_context
  category: root
  weight: 0.4
  pattern_type: string_literal
  patterns:
    - "u:r:magisk:s0"
  evidence_type: bytecode_string

- id: kernelsu_binary_paths
  category: root
  weight: 0.3
  pattern_type: string_literal
  patterns:
    # /data/adb/ksud is a strict substring of /data/adb/ksu (matching already
    # covers it), so it would add zero distinct matches - dropped as redundant.
    - "/data/adb/ksu"
  evidence_type: bytecode_string

- id: zygisk_artifact_paths
  category: root
  weight: 0.3
  pattern_type: string_literal
  patterns:
    # /data/adb/modules/zygisk_ (the per-module prefix) is subsumed by the
    # directory literal above it - dropped as redundant.
    - "/data/adb/modules/zygisk"
    - "/data/adb/magisk/zygisk"
  evidence_type: bytecode_string

- id: magisk_denylist_artifacts
  category: root
  weight: 0.3
  pattern_type: string_literal
  patterns:
    - "/data/adb/denylist"
    - "/data/adb/magisk/denylist.db"
  evidence_type: bytecode_string
