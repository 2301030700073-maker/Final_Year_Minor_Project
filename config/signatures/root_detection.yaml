- id: root_tools_library
  category: root
  weight: 0.4
  pattern_type: class_reference
  # RootTools (com.stericson.RootTools) is the OWASP-MSTG-referenced root-check
  # library - the pure-Python, in-stack analog of the RootBeer class-ref
  # signature above (rootbeer_framework). It exposes isRootAvailable()/
  # isAccessGiven()/hasBinary() root queries; its presence is a deterministic
  # root-detection signal the corpus previously had no entry for, so a target
  # using it matched no signature and read as a silent clean (boundary-1 gap).
  patterns:
    - "com.stericson.RootTools"
    - "com.stericson.roottools"
    # RootShell is the lower-level Stericson library RootTools is built on, and
    # it is also shipped STANDALONE - the two artifacts are published
    # separately, so an app can carry RootShell with no RootTools class in the
    # DEX at all. Verified 2026-09-04 by corpus extraction: org.fossify
    # .filemanager (9e97d2fa...) contains 54 files referencing
    # com.stericson/RootShell and calls isRootAvailable() 9 times, yet matched
    # NO root signature and scored 0.00 - the RootTools-only pattern list above
    # missed it. isRootAvailable() is the same root-availability query that
    # earns RootTools its weight here, so it belongs to this ID rather than a
    # new one (extending a pattern list is recall-only and cannot double-count).
    - "com.stericson.RootShell"
    - "com.stericson.rootshell"
    # Smali form. Verified 2026-09-04 on the same target: apktool's smali carries
    # ONLY the slash spelling (269x Lcom/stericson/RootShell/execution/g), while
    # the dotted spelling above appears only in jadx/cfr output. Since .smali is
    # in SCANNED_SUFFIXES, a target whose java decompilation failed would match
    # nothing on the dotted patterns alone. The pin_* signatures in
    # ssl_pinning.yaml already use this smali spelling, so it is the file's
    # convention rather than a new one.
    - "com/stericson/RootShell"
    - "com/stericson/RootTools"
  evidence_type: bytecode_class

# --- Frida / Cydia Substrate hook-detection era (2026, web-grounded) ---
# The 2026 detection surface the Xposed/LSPosed/Riru block started now extends
# to runtime *instrumentation* hook detection. Frida (the dominant analysis tool
# - default control ports 27042/27043, frida-server on device, frida-gadget
# injected for non-rooted analysis) and Cydia Substrate (the classic hooking
# framework) are what a real app probes for alongside root: it scans /proc/self/maps
# for frida/gum traces and its own process for the frida-server gadget. Sources:
# OWASP-MSTG, the Advanced-Root-Checker and advance_root_detection RASP plugins,
# and the secfb Frida-bypass list (all 2026). Each literal is structurally-unlikely
# - matching one requires the app to genuinely reference the instrumentation
# artifact (MSTG-RESILIENCE-1 anti-instrumentation). Same ADR-0006 discipline as
# the Magisk/Xposed entries: additive only, not yet corpus-validated on the
# reference device, never overclaimed. A match is root/hook-detection signal, not
# proof the app is hooked; absence is NOT evidence of no Frida/Substrate.

- id: frida_detection
  category: root
  weight: 0.35
  pattern_type: string_literal
  # Process / library / thread names distinctive to Frida, used verbatim in
  # anti-Frida probes (maps/process scans). These are not bare low-signal
  # fragments: "frida-server" / "re.frida.server" / "frida-gadget" / "linjector"
  # are Frida's own artifact names, and "gum-js-loop" is Frida's JS runtime
  # thread visible in /proc/self/maps - matching them requires the app to
  # genuinely scan for Frida. The default ports (27042/27043) are deliberately
  # omitted: bare port integers are not structurally-unlikely (same discipline
  # that drops bare "/data/adb" fragments elsewhere).
  patterns:
    - "frida-server"
    - "re.frida.server"
    - "frida-gadget"
    - "linjector"
    - "gum-js-loop"
  evidence_type: bytecode_string

- id: cydia_substrate_detection
  category: root
  weight: 0.3
  pattern_type: string_literal
  # Cydia Substrate is the classic hooking framework (Cyanogen/Substrate, the
  # direct OWASP-MSTG `detectSubstrate` artifact): the app probes for the
  # com.saurik.substrate package and/or the libsubstrate.so hook library. Both
  # are Substrate-specific - matching them requires the app to genuinely look
  # for the framework. Corroborative weight; absence is NOT evidence of no
  # substrate.
  patterns:
    - "com.saurik.substrate"
    - "libsubstrate.so"
  evidence_type: bytecode_string

# --- Boot-integrity / verified-boot probe era (2026, web-grounded) ---
# A rooted/unlocked/repackaged device is caught at the *boot* layer, not just the
# su binary: the app reads system properties for verified-boot / dm-verity state
# (`ro.boot.verifiedbootstate` returns "orange"/"yellow" when the bootloader is
# unlocked, `ro.boot.vbmeta.device_state` "unlocked", `ro.boot.warranty_bit` a
# tripped Knox flag) and checks dm-verity. These Android system-property /
# verity literals are distinctive - matching one requires the app to genuinely
# probe boot integrity (MSTG-RESILIENCE-1), so false positives are low. Same
# ADR-0006 discipline: additive, corroborative weight (a boot probe is one
# signal in a multi-signal check), not yet corpus-validated on the reference
# device. Absence is NOT evidence of a locked bootloader.
- id: boot_integrity_probe
  category: root
  weight: 0.25
  pattern_type: string_literal
  patterns:
    - "ro.boot.verifiedbootstate"
    - "ro.boot.vbmeta.device_state"
    - "ro.boot.warranty_bit"
    - "dm-verity"
  evidence_type: bytecode_string

# --- Emulator-detection era (2026) ---
# A real rooted-device check is often a *fake*: on an emulator the app reads
# Build/system-property values that only an emulator exposes and treats the
# result as "not rooted" (MSTG-RESILIENCE-1/2). These emulator-only literals
# are structurally distinctive - `ro.kernel.qemu`, `ro.boot.qemu`, the
# `sdk_gphone`/`goldfish` build product/hardware names - so matching one
# requires the app to genuinely probe for an emulator. Same ADR-0006 discipline
# as the boot probe: additive, corroborative weight, not yet corpus-validated on
# the reference device. Absence is NOT evidence of a physical device.
# Deliberately OMITS bare `Build.FINGERPRINT`/`Build.MODEL`/`isEmulator` alone
# (too generic - read by benign device-ID analytics), keeping only the
# emulator-specific values.
#
# HARDWARE-GENERIC1 - `Build.HARDWARE` sat in this list and violated exactly the
# exemption above. An earlier draft of this comment called it "the
# `Build.HARDWARE` constant used to compare to them", but the matcher is a plain
# substring match over decompiled text: it sees the constant, never the
# comparison. Measured over the stored corpus (263 runs, 63 with this
# signature): it produced 184 evidence rows, and in exactly 2 runs it was the
# only literal that matched. Both are benign third-party code with no emulator
# check anywhere in the app:
#   com.jerboa 2026-08-21   coil/util/SvgUtils.java - Coil's SVG feature probe
#   com.wdiodemoapp 08-26   androidx/camera/**/quirk/*.java - CameraX device
#                           workarounds comparing Build.HARDWARE to a model
#                           name; this put root at 0.45 on two emulator
#                           signatures alone with app_owned=0.
# In every OTHER run that matched, an emulator-specific literal co-occurred
# (`goldfish` in all of them) and confidence is summed once per signature ID,
# not per pattern - so dropping this one literal costs zero measured recall
# while removing both measured false firings. The 11 literals below are the
# emulator-only values this signature is named for.
#
# EMU-RECALL1 - the five literals below were missing, and their absence produced
# a MEASURED false negative rather than a theoretical one. InsecureBankv2
# (ground truth root: true) carries a real app-owned `checkIfDeviceIsEmulator()`
# in com/android/insecurebankv2/PostLogin.java built entirely from values this
# list did not have; NONE of the seven patterns above exist anywhere in that
# APK's DEX, so a genuine emulator probe in the app's own class scored zero. The
# run left root at 0.60 (root_known_indicator_files 0.30 + root_runtime_exec_su
# 0.30) on `java/native/manifest/js = fully_analyzed` with `unknown_uncovered:
# []` - i.e. a fully-covered, confidently-wrong NEITHER, 0.10 under threshold.
#
# Verified before adding, per-pattern, in real APKs (never from an emulator-
# detection blog list):
#   google_sdk, Genymotion, "Android SDK built for x86"
#       exact DEX string constants in APK_Test/InsecureBankv2.apk, each with
#       get_xref_from() resolving to Lcom/android/insecurebankv2/PostLogin; -
#       the app's OWN class, not a bundled SDK - and again in aves'
#       defpackage/jt0.java + tl0.java.
#   ranchu   QEMU's modern machine type, the direct successor to `goldfish`
#            which is already above (the same generation gap as android.arch ->
#            androidx in the vendor taxonomy). Real literal in aves.
#   vbox86   Genymotion's VirtualBox ABI; ships as `vbox86p` in aves, so the
#            prefix covers vbox86/vbox86p/vbox86_64.
#
# Deliberately NOT added: emu64, bluestacks, nox, ldplayer, memu,
# windows_subsystem. Each is a real product name, but none appears in app-owned
# code anywhere in this corpus, and an unverified pattern is padding (`nox`/
# `memu` are also FP-prone as substrings). Five verified additions, not eleven.
#
# Recall-only by construction, and this was measured rather than assumed: every
# other APK in the analysed corpus that owns these literals (aves 0.45,
# uptodown 1.00, AndroGoat 1.00) ALREADY matches `emulator_detection` through
# `goldfish`, so extending this one signature ID cannot move their confidence
# sums - a sum counts distinct signature IDs, not patterns. The only verdict in
# the corpus that changes is the false negative: 0.30 + 0.30 + 0.25 = 0.85.
# Weight left at 0.25, deliberately: no existing weight is touched, because a
# speculative weight bump risks a false negative elsewhere while a missing
# pattern is a pure recall defect.
- id: emulator_detection
  category: root
  weight: 0.25
  pattern_type: string_literal
  patterns:
    - "ro.kernel.qemu"
    - "ro.boot.qemu"
    - "sdk_gphone"
    - "goldfish"
    - "generic_x86"
    - "generic_arm64"
    - "google_sdk"
    - "Genymotion"
    - "Android SDK built for x86"
    - "ranchu"
    - "vbox86"
  evidence_type: bytecode_string

# --- General build-props probe (2026) ---
# Beyond the single `test-keys` literal, apps probe the build/system properties
# to fingerprint a debug, debuggable, or unlocked build independent of su:
# `ro.build.fingerprint` (user vs. eng release), `ro.debuggable` (1 == debuggable),
# `ro.secure` (0 == insecure/rooted adb), `ro.build.type` (user/eng/userdebug).
# These Android system-property names are distinctive - reading one requires
# the app to genuinely query build state. Corroborative weight; absence is NOT
# evidence of a secure build. Bare `Build.MODEL` is deliberately omitted (read
# by benign analytics).
- id: build_props_probe
  category: root
  weight: 0.2
  pattern_type: string_literal
  patterns:
    - "ro.build.fingerprint"
    - "ro.debuggable"
    - "ro.secure"
    - "ro.build.type"
    - "ro.product.cpu.abi"
  evidence_type: bytecode_string

# --- 2026 corpus broadening: modern (AI/developer-built) anti-root mechanisms ---
# resetprop (Magisk's property daemon) spoofs build props to defeat test-keys
# detection; magiskpolicy is its policy tool. Their names in app bytecode are a
# real signal the app engages with Magisk's hide layer.
- id: root_resetprop_magisk
  category: root
  weight: 0.2
  pattern_type: string_literal
  patterns:
    - "resetprop"
    - "magiskpolicy"
  evidence_type: bytecode_string

# A remounted rw /system is a classic post-root indicator; modern apps parse
# /proc/mounts / mount output for it. Both spellings are carried because the
# native analog (native_proc_mounts_check) lists both and only this java half was
# missing "/proc/self/mounts" - verified as a real string constant in
# com.facebook.katana's classes14.dex (strings -a on the .dex, not via jadx), in a
# method that then reads ro.debuggable / ro.secure.
- id: rw_system_mount_check
  category: root
  weight: 0.2
  pattern_type: regex
  patterns:
    - "/proc/mounts"
    - "/proc/self/mounts"
    - "SystemMount"
    - "isSystemRW"
  evidence_type: bytecode_string

# Hardware-backed key attestation - the 2026 canonical anti-root/anti-emulator
# mechanism (Play Integrity strong verdict + KeyStore attestation). The
# android:attest certificate-chain alias and SecurityLevel are unique markers.
- id: hardware_key_attestation
  category: root
  weight: 0.3
  pattern_type: string_literal
  patterns:
    - "AttestationApplicationId"
    - "SecurityLevel.STRONGBOX"
    - "android:attest"
  evidence_type: bytecode_string

# Non-goldfish emulator markets: BlueStacks/Nox/Genymotion ship distinctive
# package names an app can query; `ranchu` is the QEMU device model. Classic
# anti-emulator markers complementing the `goldfish` signature.
#
# `ranchu` stays on the far side of HARDWARE-GENERIC1's line. It also fires in
# CameraX's quirk classes (which compare `Build.HARDWARE` to "ranchu"), but
# naming an emulator is itself the signal this corpus keys on. Reading a build
# field is not: it says nothing until you can see what it is compared against,
# and a substring matcher cannot. Keep the emulator names, drop the bare reads.
- id: emulator_market_artifacts
  category: root
  weight: 0.2
  pattern_type: string_literal
  patterns:
    - "com.genymotion"
    - "com.bluestacks"
    - "com.bignox"
    - "ranchu"
  evidence_type: bytecode_string

# Modern systemless root/GSI (Magisk, Android 10+) use an overlayfs mount to make
# /system appear modified; apps detect it via overlayfs props/mount markers.
- id: overlayfs_system
  category: root
  weight: 0.2
  pattern_type: string_literal
  patterns:
    - "overlayfs"
    - "ro.overlayfs"
  evidence_type: bytecode_string

# Magisk/KernelSU daemon abstract-socket scan: reads /proc/net/unix looking for
# @magisk_service / @ksu_ / @zygisk_service. Survives filesystem hiding - a
# real 2026 runtime vector (Flutter Shield vector #9, Advanced Root Checker).
- id: magisk_daemon_socket_scan
  category: root
  weight: 0.3
  pattern_type: string_literal
  patterns:
    - "@magisk_service"
    - "@ksu_"
    - "/proc/net/unix"
    - "@zygisk_service"
  evidence_type: bytecode_string

# Zygisk process-maps scan: /proc/self/maps for zygisk / libzygisk.so refs.
- id: zygisk_process_maps_scan
  category: root
  weight: 0.3
  pattern_type: string_literal
  patterns:
    - "/proc/self/maps"
    - "zygisk"
    - "libzygisk.so"
  evidence_type: bytecode_string

# SELinux kernel-policy probe (DirtySepolicy / Duck Detector, the 2026 frontier):
# an app_zygote process asks the SELinux kernel whether injected rules exist for
# magisk:s0 / ksu_file:s0 / lsposed_file:s0. No userspace hiding can lie to it.
- id: selinux_policy_probe_magisk_ksu
  category: root
  weight: 0.4
  pattern_type: string_literal
  patterns:
    - "magisk:s0"
    - "ksu_file:s0"
    - "lsposed_file:s0"
    - "u:r:app_zygote"
    - "DuckDetector"
  evidence_type: bytecode_string

# Bundled root-detection SDK frameworks: Flutter Shield / RootGuard / Advanced
# Root Checker. An app that ships one of these is a "root detection present"
# finding in itself (a structured, cross-layer detector).
- id: rootguard_flutter_shield_framework
  category: root
  weight: 0.4
  pattern_type: string_literal
  patterns:
    - "flutter_shield"
    - "cordova-plugin-rootguard"
  evidence_type: bytecode_string

# Play Integrity Standard flow (2024+/1.5+): the app calls StandardIntegrityManager
# -> StandardIntegrityTokenProvider -> PrepareIntegrityTokenRequest. Distinct from
# the classic MEETS_* verdict-token sigs.
# Play Integrity remediation-dialog API (1.5+): showDialog GET_STRONG_INTEGRITY /
# GET_INTEGRITY type codes and standard-request error constants.
- id: play_integrity_remediation_dialog
  category: root
  weight: 0.3
  pattern_type: string_literal
  patterns:
    - "GET_STRONG_INTEGRITY"
    - "INTEGRITY_TOKEN_PROVIDER_INVALID"
    - "CLIENT_TRANSIENT_ERROR"
  evidence_type: bytecode_string

# --- Commercial RASP / app-shielding SDKs (2026) ---
#
# WHY THIS BLOCK EXISTS. Every root check above is one an app's own developers
# hand-wrote (su paths, Build tags, RootBeer/RootTools, Play Integrity). A
# hardened production app - a bank, a fintech, a streaming service - frequently
# writes none of them: it links a commercial RASP SDK and lets the vendor own
# root detection. With no entry for those SDKs the engine sees an app whose root
# detection is entirely real and entirely invisible, and certifies a confident
# NEITHER over it. That is the boundary-1 failure mode (detection-shaped code
# matching no signature), not a corpus-currency nicety.
#
# PROVENANCE, AND HOW IT DIFFERS FROM THE REST OF THIS FILE. Every other
# signature here was verified by extracting its literal from a real APK in the
# analysed corpus. These two could not be: a 2026-09-04 sweep of all 17 analysed
# apps for promon|guardsquare|appdome|aheaditec|talsec|approov|criticalblue|
# zimperium|build38|arxan|verimatrix|onespan|dexprotector|whitecryption returned
# ZERO hits, because no hardened commercial app is in the corpus (the closest,
# PropertyGuru, hand-rolls its checks). So each literal below is instead quoted
# from the SDK vendor's own current integration documentation, cited inline. That
# is the same evidentiary tier the file already accepts for pin_ibm_worklight,
# pin_appcelerator_https, pin_cwac_netsecurity, pin_boye_abstractverifier,
# trustkit_pinning and rn_ssl_pinning_library - all of which are likewise absent
# from the corpus (measured: 0 files each). It is a weaker tier than DEX
# extraction and is labelled as such rather than described as verified.
#
# WHAT IS DELIBERATELY *NOT* HERE, AND WHY. DexGuard, Appdome and Digital.ai
# App Protection were considered and rejected. They do not expose a package the
# app imports; they INJECT their checks at build time and polymorphically rename
# them - Guardsquare's own product page states DexGuard "automatically injects
# endless variations of integrity checks" and that "no two protected builds ever
# look the same". A com.guardsquare.* class-reference pattern therefore cannot
# fire on a shipping DexGuard-protected app. Adding one would grow the corpus
# count while detecting nothing, which is the exact failure already documented
# for the scored OpenSSL/BoringSSL export-symbol SSL signatures. Injection-based
# shielding is a real limitation of static detection, not a signature we are
# missing; it belongs in the limitations doc, not here.
#
# These SDKs must NOT be added to KNOWN_VENDOR_PREFIXES in src/common.py.
# Vendor classification SKIPS the file, so a prefix would make these signatures
# unfirable. The rule that makes GMS a vendor - "the app did not choose to ship
# an X509TrustManager, Google did" - inverts here: linking a RASP SDK IS the
# app's own anti-tampering decision, which is precisely what we are detecting.
- id: promon_shield_rasp
  category: root
  weight: 0.4
  pattern_type: class_reference
  # Promon SHIELD - the app-shielding engine behind, among others, OneSpan's
  # Mobile Security Suite. The app's own code subclasses the SHIELD callback
  # types to react to a detected threat, so this package survives in the app's
  # DEX even though SHIELD's native blob is renamed per build.
  # Source: OneSpan integration guide, "Callbacks on Android" - "These inherited
  # classes reside in the no.promon.shield.callbacks package and have a ...Data
  # suffix, for example RootingData or RepackagingData."
  # (docs.onespan.com/mobile/docs/oapps-iga-callbacks-on-android-8-2-1)
  # Corroborated by public reversing of a SHIELD-protected Android app, which
  # identifies the shipped native library as libshield.so
  # (github.com/KiFilterFiberContext/promon-reversal).
  patterns:
    - "no.promon.shield"
    - "no/promon/shield"
  evidence_type: bytecode_class

- id: talsec_freerasp_sdk
  category: root
  weight: 0.4
  pattern_type: class_reference
  # Talsec freeRASP - the most widely integrated free RASP SDK on Android, with
  # first-party Flutter / React Native / Capacitor / Cordova / Unity wrappers, so
  # it appears in cross-platform production apps that ship no hand-written root
  # check at all. Its detector covers su, Magisk, KernelSU, Shamiko,
  # HideMyApplist, Frida and LSPosed; the app calls Talsec.start(...) and
  # implements ThreatListener.
  #
  # BOTH package forms are required, and this is the reason verifying beat
  # recalling: the current integration guide (freeRASP 19.2.1, read 2026-09-04)
  # states plainly that "the Maven group com.aheaditec.talsec.security differs
  # from the runtime package", which is app.talsec.rasp.security.api. A signature
  # carrying only the Maven-group form - the name the SDK is universally known by
  # - would silently miss every current integration, while one carrying only the
  # new runtime package would miss the many shipped apps still on the older SDK.
  # The Maven coordinate string also survives into build metadata.
  # Sources (verbatim): Gradle line "implementation 'com.aheaditec.talsec
  # .security:TalsecSecurity-Community:19.2.1'" and imports
  # "app.talsec.rasp.security.api.{Talsec,TalsecConfig,ThreatListener}"
  # (docs.talsec.app/freerasp/freerasp/integration/android.md).
  #
  # The bare type names (Talsec, ThreatListener, TalsecMode) are deliberately
  # excluded: ThreatListener is generic enough to collide with unrelated app
  # code, and the package prefixes already match every file that references them.
  patterns:
    - "app.talsec.rasp.security.api"
    - "com.aheaditec.talsec.security"
    - "app/talsec/rasp/security/api"
    - "com/aheaditec/talsec/security"
  evidence_type: bytecode_class
