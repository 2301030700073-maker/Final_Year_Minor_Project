  patterns:
    - "nl/xservices/plugins/sslCertificateChecker;->execute"
  evidence_type: bytecode_string

- id: pin_flutter_http_cert
  category: ssl
  weight: 0.4
  pattern_type: string_literal
  patterns:
    - "diefferson/http_certificate_pinning/HttpCertificatePinning;->checkConnexion"
  evidence_type: bytecode_string

- id: pin_flutter_sslpinning_plugin
  category: ssl
  weight: 0.4
  pattern_type: string_literal
  patterns:
    - "com/macif/plugin/sslpinningplugin/SslPinningPlugin;->checkConnexion"
  evidence_type: bytecode_string

- id: pin_cronet_add_public_key_pins
  category: ssl
  weight: 0.4
  pattern_type: string_literal
  patterns:
    - "org/chromium/net/impl/CronetEngineBuilderImpl;->addPublicKeyPins"
  evidence_type: bytecode_string

- id: pin_conscrypt_trustmanagerimpl
  category: ssl
  weight: 0.3
  pattern_type: string_literal
  patterns:
    - "com/android/org/conscrypt/TrustManagerImpl;->verifyChain"
  evidence_type: bytecode_string

- id: pin_boye_abstractverifier
  category: ssl
  weight: 0.3
  pattern_type: string_literal
  patterns:
