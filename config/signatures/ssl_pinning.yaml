# SSL/TLS pinning signatures for Phase 1 (UnCrackable1).
# Starter set, provisional pending the Step 0 manual spike - Step 0 also
# needs to confirm whether UnCrackable1 implements certificate pinning
# at all (its documented behavior is mainly root/debugger detection plus
# an encrypted secret; a NEITHER/Inconclusive result for this category
# is a legitimate, correct outcome, not evidence something's broken).
#
# okhttp_certificate_pinner and custom_trustmanager_checkservertrusted were
# revised after a real production app (PropertyGuru, 151MB, bundles OkHttp)
# scored SSL confidence 0.90 from these two signatures alone - confirmed
# false positive, not a real finding, by reading the actual matched files
# directly: every "okhttp3.CertificatePinner" match traced to OkHttp's OWN
# library source (including CertificatePinner.java matching its own class
# name in its own defining file), and every "X509TrustManager" match was a
# type reference (import/field/parameter/getter) inside OkHttp's plumbing
# for ACCEPTING a caller-supplied TrustManager, never an actual `implements
# X509TrustManager`. The 3 "checkServerTrusted" matches were a coincidentally-
# named local variable calling Android's own platform API
# (X509TrustManagerExtensions.checkServerTrusted), unrelated to pinning.
# Neither signature had ever been validated against real SSL-related code
# before this - UnCrackable1-3 have none at all. Revised, not silently
# patched - see docs/plans/handoff/phase-4-handoff.md.

- id: okhttp_certificate_pinner
  category: ssl
  weight: 0.5
  pattern_type: regex
  patterns:
    # Requires the actual Builder() construction call, not just the bare
    # class name existing (which matches OkHttp's own library code, always
    # present whenever OkHttp is bundled, pinning configured or not).
    - 'CertificatePinner\.Builder\s*\('
  evidence_type: bytecode_string

- id: custom_trustmanager_checkservertrusted
  category: ssl
  weight: 0.3
  pattern_type: regex
  patterns:
    # Requires the class declaration itself to state it implements the
    # interface - not just a reference to the type (a parameter, field,
    # getter, or import), which is common in any code that merely ACCEPTS
    # a caller-supplied TrustManager without implementing one itself.
    # Still not proof of pinning specifically (a custom implementation can
    # exist for other trust-decision reasons) - lower weight than before
    # reflects that remaining ambiguity honestly rather than overclaiming.
    - 'implements\s+[\w<>,\s.]*X509TrustManager'
  evidence_type: bytecode_string

- id: network_security_config_pinset
  category: ssl
  weight: 0.5
  pattern_type: regex
  patterns:
    - "<pin-set"
  evidence_type: resource_xml

- id: certificate_pin_hash_literal
  category: ssl
  weight: 0.3
  pattern_type: regex
  patterns:
    - 'sha256/[A-Za-z0-9+/]{20,}={0,2}'
  evidence_type: bytecode_string

- id: network_security_config_pin_digest
  category: ssl
  weight: 0.3
  pattern_type: regex
  patterns:
    # Android Network Security Config pins (the framework-enforced mechanism)
    # are <pin digest="SHA-256">base64</pin>, NOT OkHttp's "sha256/..." form -
    # so certificate_pin_hash_literal above can never see them. This matches
    # the real NSC pin element directly. The strict `digest="SHA-256">` anchor
    # only occurs inside a <pin-set> pin, keeping false positives low. Added
    # after RS_CertPinning (ground-truth ssl:true) scored only 0.5 from
    # network_security_config_pinset alone: a definitive framework-enforced
    # <pin-set> with real SHA-256 pins was invisible to the old hash signature.
    - 'digest="SHA-256">[A-Za-z0-9+/]{20,}={0,2}'
  evidence_type: resource_xml
- id: trust_all_x509_checkservertrusted
  category: ssl
  weight: 0.4
  pattern_type: regex
  multiline: true
  case_sensitive: false
  # The canonical trust-all bypass: an X509TrustManager whose
  # checkServerTrusted(...) body is EMPTY - it accepts any chain. Distinct
  # from custom_trustmanager_checkservertrusted (which only catches the
  # `implements X509TrustManager` type reference, not what the impl does). The
  # jadx decompiler routinely splits the signature and the empty body across
  # lines, so this opts into the L-M9 multiline whole-text pass; DOTALL lets
  # `[^)]*` span the parameter newline. Empty-body-only keeps false positives
  # near zero - a real implementation always has a body.
  patterns:
    # `[^{]*` after the params lets a `) throws CertificateException {` clause
    # sit between the close paren and the body brace (the common real shape).
    - 'checkServerTrusted\s*\([^)]*\)[^{]*\{\s*\}'
  evidence_type: source
- id: hostname_verifier_always_true
  category: ssl
  weight: 0.35
  pattern_type: regex
  multiline: true
  case_sensitive: false
  # Hostname bypass: a HostnameVerifier.verify(...) that unconditionally
  # returns true accepts any hostname for any certificate - the other half of
  # the trust-all pair. Case-insensitive so "Boolean"/"VERIFY" naming variants
  # don't escape (L-M9); multiline because the decompiler wraps the signature
  # and `return true;`. The unconditional-true body is the bypass, so false
  # positives are limited to code that genuinely means "accept all hosts".
  patterns:
    - 'boolean\s+verify\s*\([^)]*\)\s*\{\s*return\s+true\s*;'
  evidence_type: source
