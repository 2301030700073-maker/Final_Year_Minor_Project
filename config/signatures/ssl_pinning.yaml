# --- web-grounded 2026 expansion III: React-Native pinning ---
# RN apps pin through the react-native-ssl-pinning library (SSLPinningFactory,
# com.gs.rnsslpinning) - a whole pinning surface invisible to the OkHttp/NSC
# rules (the RN JS-side pins are separately covered by the hermes js_ssl_pinner
# idioms, gap A1). The literal is library-specific and lives in the APP's own
# reference to the API (not vendor-excluded), so it only fires when the app
# genuinely uses the library to pin. ADR-0006: additive, not yet corpus-validated.
- id: rn_ssl_pinning_library
  category: ssl
  weight: 0.4
  pattern_type: string_literal
  case_sensitive: false
  patterns:
    - "SSLPinningFactory"
    - "com.gs.rnsslpinning"
    - "react-native-ssl-pinning"
  evidence_type: bytecode_string

# --- 2026 corpus broadening: modern (AI/developer-built) pinning mechanisms ---
# Cash App Paraphrase - a modern certificate-pinning library (fintech/2021+).
# The unique package marker is the reliable signal.
- id: pin_cash_paraphrase
