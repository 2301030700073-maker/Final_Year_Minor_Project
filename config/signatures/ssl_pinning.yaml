# SSL/TLS pinning signatures for Phase 1 (UnCrackable1).
# Starter set, provisional pending the Step 0 manual spike - Step 0 also
# needs to confirm whether UnCrackable1 implements certificate pinning
# at all (its documented behavior is mainly root/debugger detection plus
# an encrypted secret; a NEITHER/Inconclusive result for this category
# is a legitimate, correct outcome, not evidence something's broken).
#
# okhttp_certificate_pinner and custom_trustmanager_checkservertrusted were
# revised after a real production app (PropertyGuru, 151MB, bundles OkHttp)
# scored SSL confidence 0.90 from these two signatures alone - confirmed
# false positive, not a real finding, by reading the actual matched files
# directly: every "okhttp3.CertificatePinner" match traced to OkHttp's OWN
# library source (including CertificatePinner.java matching its own class
# name in its own defining file), and every "X509TrustManager" match was a
# type reference (import/field/parameter/getter) inside OkHttp's plumbing
# for ACCEPTING a caller-supplied TrustManager, never an actual `implements
# X509TrustManager`. The 3 "checkServerTrusted" matches were a coincidentally-
# named local variable calling Android's own platform API
# (X509TrustManagerExtensions.checkServerTrusted), unrelated to pinning.
# Neither signature had ever been validated against real SSL-related code
# before this - UnCrackable1-3 have none at all. Revised, not silently
# patched - see docs/plans/handoff/phase-4-handoff.md.

- id: okhttp_certificate_pinner
  category: ssl
  weight: 0.5
  pattern_type: regex
  patterns:
    # Requires the actual Builder() construction call, not just the bare
    # class name existing (which matches OkHttp's own library code, always
    # present whenever OkHttp is bundled, pinning configured or not).
    - 'CertificatePinner\.Builder\s*\('
  evidence_type: bytecode_string

- id: custom_trustmanager_checkservertrusted
  category: ssl
  weight: 0.3
  pattern_type: regex
  patterns:
    # Requires the class declaration itself to state it implements the
    # interface - not just a reference to the type (a parameter, field,
    # getter, or import), which is common in any code that merely ACCEPTS
    # a caller-supplied TrustManager without implementing one itself.
    # Still not proof of pinning specifically (a custom implementation can
    # exist for other trust-decision reasons) - lower weight than before
    # reflects that remaining ambiguity honestly rather than overclaiming.
    - 'implements\s+[\w<>,\s.]*X509TrustManager'
  evidence_type: bytecode_string

- id: network_security_config_pinset
  category: ssl
  weight: 0.5
  pattern_type: regex
  patterns:
    - "<pin-set"
  evidence_type: resource_xml

- id: certificate_pin_hash_literal
  category: ssl
  weight: 0.3
  pattern_type: regex
  patterns:
    - 'sha256/[A-Za-z0-9+/]{20,}={0,2}'
  evidence_type: bytecode_string

- id: network_security_config_pin_digest
  category: ssl
  weight: 0.3
  pattern_type: regex
  patterns:
    # Android Network Security Config pins (the framework-enforced mechanism)
    # are <pin digest="SHA-256">base64</pin>, NOT OkHttp's "sha256/..." form -
    # so certificate_pin_hash_literal above can never see them. This matches
    # the real NSC pin element directly. The strict `digest="SHA-256">` anchor
    # only occurs inside a <pin-set> pin, keeping false positives low. Added
    # after RS_CertPinning (ground-truth ssl:true) scored only 0.5 from
    # network_security_config_pinset alone: a definitive framework-enforced
    # <pin-set> with real SHA-256 pins was invisible to the old hash signature.
    - 'digest="SHA-256">[A-Za-z0-9+/]{20,}={0,2}'
  evidence_type: resource_xml
- id: trust_all_x509_checkservertrusted
  category: ssl
  weight: 0.4
  pattern_type: regex
  multiline: true
  case_sensitive: false
  # The canonical trust-all bypass: an X509TrustManager whose
  # checkServerTrusted(...) body is EMPTY - it accepts any chain. Distinct
  # from custom_trustmanager_checkservertrusted (which only catches the
  # `implements X509TrustManager` type reference, not what the impl does). The
  # jadx decompiler routinely splits the signature and the empty body across
  # lines, so this opts into the L-M9 multiline whole-text pass; DOTALL lets
  # `[^)]*` span the parameter newline. Empty-body-only keeps false positives
  # near zero - a real implementation always has a body.
  patterns:
    # `[^{]*` after the params lets a `) throws CertificateException {` clause
    # sit between the close paren and the body brace (the common real shape).
    - 'checkServerTrusted\s*\([^)]*\)[^{]*\{\s*\}'
  evidence_type: source
- id: hostname_verifier_always_true
  category: ssl
  weight: 0.35
  pattern_type: regex
  multiline: true
  case_sensitive: false
  # Hostname bypass: a HostnameVerifier.verify(...) that unconditionally
  # returns true accepts any hostname for any certificate - the other half of
  # the trust-all pair. Case-insensitive so "Boolean"/"VERIFY" naming variants
  # don't escape (L-M9); multiline because the decompiler wraps the signature
  # and `return true;`. The unconditional-true body is the bypass, so false
  # positives are limited to code that genuinely means "accept all hosts".
  patterns:
    - 'boolean\s+verify\s*\([^)]*\)\s*\{\s*return\s+true\s*;'
  evidence_type: source
# --- L-M3: expanded SSL-pinning taxonomy toward the industry-standard 15
# categories (APKShield-PT / Trafexia / Ostorlab / HackTricks, 2026). Each new
# id is additive - it fires only when its technique is present, so existing
# calibrated confidences are untouched. These detect pinning/trust-anchor
# techniques (and trust-all anti-cert-check patterns) that the original 7 could
# not see.

- id: webview_ssl_error_handler_proceed
  category: ssl
  weight: 0.4
  pattern_type: regex
  multiline: true
  case_sensitive: false
  # WebView anti-cert-check bypass: onReceivedSslError(...) calls
  # handler.proceed(), accepting any certificate error. Bounded lazy `.{0,200}?`
  # keeps the regex linear (ReDoS-safe, NFR-1); DOTALL (via multiline) lets it
  # span the signature/body newline the decompiler introduces. The proceed()
  # call is the signal, so false positives are limited to code that genuinely
  # swallows cert errors.
  patterns:
    - 'onReceivedSslError.{0,200}?proceed\s*\('
  evidence_type: source

- id: trustkit_pinning
  category: ssl
  weight: 0.45
  pattern_type: class_reference
  case_sensitive: false
  # TrustKit (com.datatheorem.android.trustkit) is a dedicated pinning library;
  # its presence means the app enforces certificate pinning through TrustKit's
  # evaluator (Android's NSC or a custom TrustManager). A class reference, not
  # the app's own pin - but a real, verifiable pinning-against-the-lib signal.
  patterns:
    - 'com.datatheorem.android.trustkit'
  evidence_type: bytecode_string

- id: keystore_set_certificate_entry
  category: ssl
  weight: 0.3
  pattern_type: string_literal
  case_sensitive: false
  # KeyStore.setCertificateEntry(...) - a common hand-rolled pinning technique
  # (Ostorlab): the app pins a server cert into a KeyStore and only accepts
  # chains anchored there. Detecting the API call is the pin-against-custom-store
  # signal. Lower weight - storing a cert is necessary for the technique but not
  # by itself proof of enforcement.
  patterns:
    - 'setCertificateEntry'
  evidence_type: bytecode_string

- id: certificate_factory_x509
  category: ssl
  weight: 0.3
  pattern_type: regex
  # CertificateFactory.getInstance("X.509") to build a Certificate from raw bytes
  # is the classic hand-rolled verification pinning path (Ostorlab). The specific
  # call (not the bare class name) keeps false positives to code that genuinely
  # parses certificates.
  patterns:
    - 'CertificateFactory\.getInstance\s*\(\s*["'']X\.509'
  evidence_type: bytecode_string

- id: okhttp4_kotlin_certificate_pinner
  category: ssl
  weight: 0.5
  pattern_type: regex
  multiline: true
  case_sensitive: false
  # OkHttp 4 (Kotlin) pins via CertificatePinner.Builder().add("host", "sha256/..")
  # or the builder-lambda form. The existing okhttp_certificate_pinner matches the
  # Builder() construction; this requires the actual .add() pin call, catching the
  # Kotlin DSL variant the single-line pattern can miss when the decompiler wraps
  # it. Bounded `.{0,80}?` keeps it linear.
  patterns:
    - 'CertificatePinner\.Builder.{0,80}?\.add\s*\('
  evidence_type: source

- id: cronet_cert_verifier
  category: ssl
  weight: 0.45
  pattern_type: string_literal
  case_sensitive: false
  # Cronet (org.chromium.net) pins via CronetEngine.Builder.setCertVerifier(...)
  # with a custom CertVerifier - gRPC-over-Cronet / modern network stacks bypass
  # OkHttp's CertificatePinner entirely. setCertVerifier is Cronet-specific, so
  # the string is a low-false-positive pinning signal.
  patterns:
    - 'setCertVerifier'
  evidence_type: bytecode_string

- id: certificate_transparency_verifier
  category: ssl
  weight: 0.35
  pattern_type: regex
  case_sensitive: false
  # Certificate Transparency: an app enforcing CT log verification (com.google.
  # certificate.transparency / CTLogInfo / isLogVerifierEnabled) adds a pinning-
  # adjacent certificate-verification layer. Lower weight - CT is an additional
  # check on top of pinning, not pinning itself. Case-insensitive so
  # "CTLOGINFO"/"islogverifierenabled" variants don't escape.
  patterns:
    - 'CTLogInfo|isLogVerifierEnabled|com\.google\.certificate\.transparency'
  evidence_type: bytecode_string

- id: custom_sslsocketfactory
  category: ssl
  weight: 0.3
  pattern_type: regex
  # A custom javax.net.ssl.SSLSocketFactory subclass that overrides socket
  # creation to control trust - a hand-rolled TLS pinning/trust technique
  # distinct from OkHttp's CertificatePinner and the TrustManager path. Requires
  # the `extends ... SSLSocketFactory` declaration (not the bare class name,
  # which appears in any SSLContext setup), keeping false positives low. Lower
  # weight - overriding the factory is necessary for the technique but not by
  # itself proof of trust-all behavior.
  patterns:
    - 'extends\s+[\w<>,\s.]*SSLSocketFactory'
  evidence_type: bytecode_string

- id: custom_x509extended_trustmanager
  category: ssl
  weight: 0.35
  pattern_type: regex
  # X509ExtendedTrustManager is the TrustManager subclass used by TLS 1.3 and
  # SSLEngine-based stacks (okhttp 4+, async sockets). Apps implementing pinning
  # there subclass it via `extends X509ExtendedTrustManager` - which the existing
  # custom_trustmanager_checkservertrusted (`implements X509TrustManager`) cannot
  # see, so a real pin/trust-decision impl was an invisible hole. Requires the
  # `extends ... X509ExtendedTrustManager` declaration, not the bare class name
  # (which appears in any SSLContext setup/import). Lower weight - a custom
  # implementation can exist for non-pinning trust decisions too, the same
  # honesty as custom_trustmanager_checkservertrusted.
  patterns:
    - 'extends\s+[\w<>,\s.]*X509ExtendedTrustManager'
  evidence_type: bytecode_string

# --- web-grounded 2026 SSL-pinning taxonomy expansion ---
# Each is additive and structurally-unlikely, so it only fires when the app
# genuinely implements the technique. Same ADR-0006 discipline as the earlier
# expansions: additive only, not yet corpus-validated against each library.

- id: expect_certificate_pin
  category: ssl
  weight: 0.4
  pattern_type: string_literal
  # The classic moxie0/ssl-pinning OkHttp interceptor API:
  # PinningTrustManager / expectCertificatePin("host", "sha256/...") - a whole
  # pinning library keyed on this single method. The method reference is
  # library-specific, so it only appears when the app actually uses it to pin.
  patterns:
    - "expectCertificatePin"
  evidence_type: bytecode_string

- id: certificate_pinner_add_host
  category: ssl
  weight: 0.3
  pattern_type: regex
  # OkHttp's per-hostname pin: .add("host", "sha256/...") on a CertificatePinner
  # Builder. Distinct from okhttp_certificate_pinner (matches the Builder()
  # construction) and okhttp4_kotlin (matches the DSL .add) - this is the specific
  # Java form that names the pinned host, present only in a real pin config.
  # Bounded lazy .{0,20}? keeps the regex linear (ReDoS-safe, NFR-1).
  patterns:
    - '\.add\(\s*"[^"]+",\s*"sha256/'
  evidence_type: bytecode_string

- id: sha1_pin_hash_literal
  category: ssl
  weight: 0.25
  pattern_type: regex
  # OkHttp pins may be SHA-1 (or SHA-256): the "sha1/<b64>" form is a real pin
  # digest that certificate_pin_hash_literal ("sha256/...") cannot see. The
  # "sha1/" scheme prefix only occurs inside a real pin specification, keeping
  # false positives low.
  patterns:
    - 'sha1/[A-Za-z0-9+/]{20,}={0,2}'
  evidence_type: bytecode_string

- id: okhttp_hostname_verifier_set
  category: ssl
  weight: 0.3
  pattern_type: string_literal
  # OkHttpClient.Builder().hostnameVerifier(...) installs a custom hostname
  # verifier - the standard hook point for a trust-all or pin-specific verifier.
  # The builder method is OkHttp-specific, so it only appears when the app
  # explicitly overrides hostname verification (a TLS trust control).
  patterns:
    - "hostnameVerifier("
  evidence_type: bytecode_string

- id: sslcontext_init_with_trustmanager
  category: ssl
  weight: 0.3
  pattern_type: regex
  multiline: true
  case_sensitive: false
  # The certificate-embedding pinning technique: SSLContext.init(null,
  # trustManagers, ...) where the TrustManagerFactory was initialized from a
  # KeyStore of pinned certs. Requires both the TLS SSLContext.getInstance and a
  # nearby .init( call (bounded, so the regex stays linear). Moderate weight and
  # an honest note: setting up a custom trust store is necessary for the technique
  # but not by itself proof of pinning (could be a user-CA trust store).
  patterns:
    - 'SSLContext\.getInstance\([^)]*TLS[^)]*\).{0,200}?\.init\s*\('
  evidence_type: source

# --- web-grounded 2026 expansion II: legacy & custom pinning hooks ---
# Targets the custom-manual and legacy implementations the OkHttp/NSC signatures
# cannot see: Volley's HurlStack, the setSSLSocketFactory / setDefaultHostnameVerifier
# trust hooks, the manual SPKI-hash pin function, a custom X509KeyManager (mTLS),
# and NSC user-cert trust. Each is specific enough to keep false positives low.
# ADR-0006: additive, not yet corpus-validated.

- id: hurlstack_sslsocketfactory
  category: ssl
  weight: 0.3
  pattern_type: string_literal
  patterns:
    - "HurlStack"
  evidence_type: bytecode_string

- id: set_sslsocketfactory
  category: ssl
  weight: 0.3
  pattern_type: string_literal
  patterns:
    - "setSSLSocketFactory"
  evidence_type: bytecode_string

- id: set_default_hostname_verifier
  category: ssl
  weight: 0.3
  pattern_type: string_literal
  patterns:
    - "setDefaultHostnameVerifier"
  evidence_type: bytecode_string

- id: spki_sha256_pin
  category: ssl
  weight: 0.3
  pattern_type: string_literal
  patterns:
    - "spkiSha256Pin"
  evidence_type: bytecode_string

- id: custom_x509keymanager
  category: ssl
  weight: 0.25
  pattern_type: regex
  patterns:
    - 'implements\s+X509KeyManager'
  evidence_type: bytecode_string

- id: nsc_user_cert_trust
  category: ssl
  weight: 0.2
  pattern_type: string_literal
  patterns:
    - '<certificates src="user"'
    - '<debug-overrides>'
  evidence_type: resource_xml

# --- Integrated external pattern set: aancw/smali-sslpin-patterns (MIT) ---
# The well-known open-source smali pinning-pattern collection (28 categories,
# 44 patterns) was fetched and curated into the deterministic engine. These are
# SMALI-specific signatures (the `;` and `->` syntax only occurs in .smali, which
# the Java-oriented regex rules above cannot see), so they are strictly additive
# to the smali surface scan() already walks. Each fires on the APP's own smali
# reference to a named pinning framework - a real pinning implementation, not a
# generic SDK doing unrelated checks. Only the framework signatures that were NOT
# already covered are integrated; redundant ones (okhttp/squareup/trustkit class
# refs already handled) were dropped to avoid inflating confidence.
# ADR-0006: sourced from an MIT third party, additive, not yet corpus-validated.
# Third-party note: the app's own smali reference to these APIs lives in the app
# package (never vendor-excluded); the vendored library's internal file would be
# excluded only where the namespace is a recognized vendor (none of these are).

- id: pin_appcelerator_https
  category: ssl
  weight: 0.4
  pattern_type: string_literal
  patterns:
    - "appcelerator/https/PinningTrustManager;->checkServerTrusted"
  evidence_type: bytecode_string

- id: pin_ibm_worklight
  category: ssl
  weight: 0.4
  pattern_type: string_literal
  patterns:
    - "com/worklight/wlclient/api/WLClient;->pinTrustedCertificatePublicKey"
  evidence_type: bytecode_string

- id: pin_worklight_hostname_verifier
  category: ssl
  weight: 0.3
  pattern_type: string_literal
  patterns:
    - "com/worklight/wlclient/certificatepinning/HostNameVerifierWithCertificatePinning;->verify"
  evidence_type: bytecode_string

- id: pin_cwac_netsecurity
  category: ssl
  weight: 0.35
  pattern_type: string_literal
  patterns:
    - "com/commonsware/cwac/netsecurity/conscrypt/CertPinManager;->isChainValid"
  evidence_type: bytecode_string

- id: pin_netty_fingerprint_tmf
  category: ssl
  weight: 0.35
  pattern_type: string_literal
  patterns:
    - "io/netty/handler/ssl/util/FingerprintTrustManagerFactory;->checkTrusted"
