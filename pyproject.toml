[project]
name = "ssl-pinning-analysis"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "typer>=0.12",
    "rich>=13.0",
    "pyyaml>=6.0",
    "jinja2>=3.1",
    "frida<17",
    "objection>=1.11",
    "sqlalchemy>=2.0",
    "androguard>=4.1.4",
    "pyelftools>=0.33",
    "pyaxmlparser>=0.3.31",
    "capstone>=5.0.9",
]

[dependency-groups]
dev = ["pytest>=8.0"]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["src", "scripts"]
# Scope a bare `uv run pytest` to THIS project's tests. Without testpaths,
# pytest auto-discovers the whole repo root and errors on the vendored Ghidra
# bundle (its PyGhidra tests import jpype) and wastes ~80s walking APK_Test/
# (large APKs), outputs/, and the vendored tools/ tree. The unit suite IS the
# project's pytest record (per the testing philosophy); the dynamic side is
# recorded by each phase's real handoff bundle, not pytest.
testpaths = ["tests/unit"]
norecursedirs = ["tools", ".git", ".venv", "__pycache__"]
markers = [
    # Opt-out of the module-wide hermetic tool-resolution pin in
    # tests/unit/test_decompile.py: a test marked this way exercises the REAL
    # _find_jadx/_jadx_version/require_tool resolution instead of the stubs.
    "real_tool_resolution: test exercises real toolchain resolution (not stubbed)",
]
